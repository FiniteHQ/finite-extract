version: 2
# open-pull-requests-limit: 0 disables routine *version* update PRs while
# leaving *security* update PRs unaffected (they ignore this limit).
# Net effect: Dependabot only opens PRs for known security advisories.
# NOTE: repo-level "Dependabot security updates" must also be ON
#       (Settings -> Code security -> Dependabot security updates).
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    reviewers:
      - cyrus-is

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    reviewers:
      - cyrus-is
