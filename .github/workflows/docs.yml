name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-docs-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-docs-
            ${{ runner.os }}-spm-

      - name: Build documentation
        run: |
          swift package --allow-writing-to-directory ./_site \
            generate-documentation \
            --target FiniteExtract \
            --transform-for-static-hosting \
            --hosting-base-path finite-extract \
            --output-path ./_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
