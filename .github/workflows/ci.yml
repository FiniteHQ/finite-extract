name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Cache SwiftPM .build
        uses: actions/cache@v4
        with:
          path: .build
          # Package.resolved is gitignored here, so key on Package.swift (the
          # pinned deps). hashFiles ignores missing files, so listing both is safe.
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint if not present
        run: command -v swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: SwiftLint (strict — warnings fail the build)
        run: swiftlint lint --strict

      - name: Surface inline lint suppressions for review
        if: always()
        run: |
          echo "Inline 'swiftlint:disable' directives in this branch:"
          if grep -rn "swiftlint:disable" Sources Tests; then
            grep -rn "swiftlint:disable" Sources Tests | while IFS= read -r line; do
              echo "::warning::Inline lint suppression — confirm it is justified: ${line}"
            done
          else
            echo "(none)"
          fi
